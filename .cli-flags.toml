[help]
url = "https://github.com/wasm-xprs/wasmx-desktop-cli"
columns = ["options", "env", "type", "default", "description"]

[parse]
stop_at_first_positional = false
allow_unknown = false

[env]
ignore = ["WASMX_DESKTOP_TOKEN"]

[commands.status]
help = "Show local wasm-xprs Wasmtime daemon status."

[commands.doctor]
help = "Verify daemon readiness, authentication, and the expected wasm-xprs runtime contract."

[commands.list]
help = "List persisted local Wasm deployments."

[commands.inspect]
help = "Inspect one deployment and its integrity metadata."

[commands.inspect.flags.tenant]
env = "WASMX_DESKTOP_TENANT_ID"
aliases = ["tenant"]
type = "string"
help = "Tenant id."

[commands.inspect.flags.deployment]
env = "WASMX_DESKTOP_DEPLOYMENT_ID"
aliases = ["deployment"]
type = "string"
help = "Immutable deployment generation id."

[commands.deploy]
help = "Compile and install a Wasm deployment into the local daemon."

[commands.deploy.flags.tenant]
env = "WASMX_DESKTOP_TENANT_ID"
aliases = ["tenant"]
type = "string"
help = "Tenant id."

[commands.deploy.flags.deployment]
env = "WASMX_DESKTOP_DEPLOYMENT_ID"
aliases = ["deployment"]
type = "string"
help = "Immutable deployment generation id."

[commands.deploy.flags.module]
env = "WASMX_DESKTOP_MODULE"
aliases = ["module"]
short = "m"
type = "string"
help = "Path to a .wasm module."

[commands.deploy.flags.ores-adapter]
env = "WASMX_DESKTOP_ORES_ADAPTER"
aliases = ["ores-adapter"]
type = "string"
help = "Optional path to an ores.lambda.adapter/v1 JSON descriptor emitted by ores-stack."

[commands.deploy.flags.ores-receipt]
env = "WASMX_DESKTOP_ORES_RECEIPT"
aliases = ["ores-receipt"]
type = "string"
help = "Optional ores.lambda.wasm-artifact.receipt/v1 file; when supplied, bind the uploaded module and adapter bytes to the ORES build receipt before daemon mutation."

[commands.invoke]
help = "Invoke a local Wasm deployment."

[commands.invoke.flags.tenant]
env = "WASMX_DESKTOP_TENANT_ID"
aliases = ["tenant"]
type = "string"
help = "Tenant id."

[commands.invoke.flags.deployment]
env = "WASMX_DESKTOP_DEPLOYMENT_ID"
aliases = ["deployment"]
type = "string"
help = "Immutable deployment generation id."

[commands.invoke.flags.payload]
env = "WASMX_DESKTOP_PAYLOAD"
aliases = ["payload"]
short = "p"
type = "json"
default = "{}"
help = "JSON invocation payload."

[commands.invoke.flags.fuel]
env = "WASMX_DESKTOP_FUEL"
aliases = ["fuel"]
type = "integer"
help = "Optional Wasmtime fuel budget."

[commands.invoke.flags.invocation-id]
env = "WASMX_DESKTOP_INVOCATION_ID"
aliases = ["invocation-id"]
type = "string"
help = "Optional caller-supplied invocation id for tracing and retry correlation."

[commands.delete]
help = "Delete a local deployment artifact."

[commands.delete.flags.tenant]
env = "WASMX_DESKTOP_TENANT_ID"
aliases = ["tenant"]
type = "string"
help = "Tenant id."

[commands.delete.flags.deployment]
env = "WASMX_DESKTOP_DEPLOYMENT_ID"
aliases = ["deployment"]
type = "string"
help = "Immutable deployment generation id."

[flags.url]
env = "WASMX_DESKTOP_DAEMON_URL"
aliases = ["url"]
short = "u"
type = "string"
default = "http://127.0.0.1:8765"
help = "Loopback URL of wasmx-desktop-daemon."

[flags.timeout]
env = "WASMX_DESKTOP_TIMEOUT_MS"
aliases = ["timeout"]
short = "t"
type = "integer"
default = 30000
help = "Invocation timeout in milliseconds."
