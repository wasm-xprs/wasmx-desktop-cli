[package]
org = "wasm-xprs"
name = "wasmx-desktop-cli"
version = "0.1.0"
description = "Rust desktop control client for wasm-xprs"
license = "MIT"
language = "rust"
keywords = ["cli", "desktop", "wasm", "rust", "global-tool"]

[package.repository]
vcs = "git"
url = "https://github.com/wasm-xprs/wasmx-desktop-cli"

[dependencies]
"oresoftware/ores-clis-core" = "^0.1.0"

# Cargo.lock is not committed yet. Promotion remains blocked until a deterministic
# lock is generated and these commands can be switched to --locked.
[build]
command = "cargo build --release --bin wasmx-desktop-cli"
outputs = ["target/release/wasmx-desktop-cli"]

[bin]
wasmx-desktop-cli = "target/release/wasmx-desktop-cli"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/wasmx-desktop-cli\" && \"$ZED_PKG_TEST_TARGET/target/release/wasmx-desktop-cli\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets"
