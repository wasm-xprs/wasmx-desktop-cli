name: replay-ores-receipt-handoff

on:
  push:
    branches:
      - feature/ores-receipt-handoff-v2-20260928

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ores-receipt-handoff-v2-20260928
      - name: Integrate receipt validation with current deploy acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/forward-ores-wasm-receipt-20260928
          git checkout origin/feature/forward-ores-wasm-receipt-20260928 -- src/ores_evidence.rs
          git diff 33cae294fa88b2bd9530e793c4a42aab2eda1fb2..origin/feature/forward-ores-wasm-receipt-20260928 -- .cli-flags.toml | git apply --index
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/main.rs')
          text = path.read_text()
          if not text.startswith('mod ores_evidence;'):
              text = 'mod ores_evidence;\n\n' + text

          old = '    WASMX_DESKTOP_ORES_ADAPTER: Option<String>,\n    WASMX_DESKTOP_PAYLOAD: Option<Value>,\n'
          new = '    WASMX_DESKTOP_ORES_ADAPTER: Option<String>,\n    WASMX_DESKTOP_ORES_RECEIPT: Option<String>,\n    WASMX_DESKTOP_PAYLOAD: Option<Value>,\n'
          if text.count(old) != 1:
              raise SystemExit('receipt config insertion point drifted')
          text = text.replace(old, new, 1)

          old_block = '''            let ores_adapter =\n                read_optional_ores_adapter(config.WASMX_DESKTOP_ORES_ADAPTER.as_deref()).await?;\n            let adapter_supplied = ores_adapter.is_some();\n            let mut body = json!({\n                "tenant_id": tenant_id,\n                "deployment_id": deployment_id,\n                "wasm_base64": BASE64.encode(&bytes),\n            });\n            if let Some(adapter) = ores_adapter {\n                body["ores_adapter"] = adapter;\n            }\n'''
          new_block = '''            let ores_adapter_path = config.WASMX_DESKTOP_ORES_ADAPTER.as_deref();\n            let ores_adapter = read_optional_ores_adapter(ores_adapter_path).await?;\n            let adapter_supplied = ores_adapter.is_some();\n            let ores_evidence = read_optional_ores_evidence(\n                ores_adapter_path,\n                config.WASMX_DESKTOP_ORES_RECEIPT.as_deref(),\n                &bytes,\n            )\n            .await?;\n            let receipt_supplied = ores_evidence.is_some();\n            let mut body = json!({\n                "tenant_id": tenant_id,\n                "deployment_id": deployment_id,\n                "wasm_base64": BASE64.encode(&bytes),\n            });\n            if let Some(adapter) = ores_adapter {\n                body["ores_adapter"] = adapter;\n            }\n            if let Some(evidence) = ores_evidence {\n                body["ores_adapter_raw_base64"] =\n                    Value::String(BASE64.encode(&evidence.adapter_bytes));\n                body["ores_receipt_raw_base64"] =\n                    Value::String(BASE64.encode(&evidence.receipt_bytes));\n            }\n'''
          if text.count(old_block) != 1:
              raise SystemExit('current deploy block drifted')
          text = text.replace(old_block, new_block, 1)

          old_branch = subprocess.check_output(
              ['git','show','origin/feature/forward-ores-wasm-receipt-20260928:src/main.rs'],
              text=True,
          )
          start = old_branch.index('async fn read_optional_ores_evidence(')
          end = old_branch.index('\nfn parse_ores_adapter_bytes', start)
          helper = old_branch[start:end] + '\n\n'
          marker = 'fn parse_ores_adapter_bytes(bytes: &[u8]) -> Result<Value> {'
          if marker not in text or 'async fn read_optional_ores_evidence(' in text:
              raise SystemExit('evidence helper insertion point drifted')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          evidence_path = Path('src/ores_evidence.rs')
          evidence = evidence_path.read_text()
          evidence = evidence.replace('    pub adapter_value: Value,\n', '', 1)
          evidence = evidence.replace('        adapter_value,\n        adapter_bytes,', '        adapter_bytes,', 1)
          evidence = evidence.replace(
              '    fn receipt_bytes(adapter: &[u8], module: &[u8]) -> Vec<u8> {\n        return serde_json::to_vec(',
              '    fn receipt_bytes(adapter: &[u8], module: &[u8]) -> Result<Vec<u8>> {\n        let bytes = serde_json::to_vec(',
              1,
          )
          evidence = evidence.replace(
              '        }))\n        .expect("receipt JSON");\n',
              '        }))?;\n        return Ok(bytes);\n',
              1,
          )
          evidence = evidence.replace('        let receipt = receipt_bytes(&adapter, module);\n', '        let receipt = receipt_bytes(&adapter, module)?;\n', 1)
          evidence = evidence.replace('    fn receipt_rejects_module_or_raw_adapter_drift() {\n', '    fn receipt_rejects_module_or_raw_adapter_drift() -> Result<()> {\n', 1)
          evidence = evidence.replace('        let receipt = receipt_bytes(&adapter, b"wasm-module");\n', '        let receipt = receipt_bytes(&adapter, b"wasm-module")?;\n', 1)
          evidence = evidence.replace(
              '        );\n    }\n}\n',
              '        );\n        return Ok(());\n    }\n}\n',
              1,
          )
          evidence_path.write_text(evidence)
          PY
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git add .cli-flags.toml src/main.rs src/ores_evidence.rs
          git rm .github/workflows/replay-ores-receipt-handoff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: verify and forward ORES WASM artifact receipts'
          git push origin HEAD:feature/ores-receipt-handoff-v2-20260928
