name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: wasmx-desktop-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt
      - name: Materialize Zed dependencies
        shell: bash
        run: bash scripts/install-zed-deps.sh
      - name: Generate deterministic lock candidate
        run: cargo generate-lockfile
      - name: Upload lock candidate
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cargo-lock-candidate
          path: Cargo.lock
          if-no-files-found: error
      - run: rustc --version --verbose
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Require committed deterministic lockfile
        shell: bash
        run: |
          git ls-files --error-unmatch Cargo.lock >/dev/null
          git diff --exit-code -- Cargo.lock
