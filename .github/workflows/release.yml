name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: wasmx-desktop-cli-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: wasmx-desktop-cli-linux-aarch64
          - os: macos-15-intel
            asset: wasmx-desktop-cli-macos-x86_64
          - os: macos-15
            asset: wasmx-desktop-cli-macos-aarch64
          - os: windows-latest
            asset: wasmx-desktop-cli-windows-x86_64.exe
          - os: windows-11-arm
            asset: wasmx-desktop-cli-windows-aarch64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build
        shell: bash
        run: cargo build --release --locked
      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/wasmx-desktop-cli "dist/${{ matrix.asset }}"
      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/wasmx-desktop-cli.exe "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes
