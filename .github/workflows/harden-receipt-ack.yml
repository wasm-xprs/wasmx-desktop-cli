name: harden-receipt-ack

on:
  push:
    branches:
      - feature/ores-receipt-handoff-v2-20260928

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ores-receipt-handoff-v2-20260928
      - name: Bind deploy acknowledgement to receipt verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main.rs')
          text = path.read_text()
          old = '''            let ores_evidence = read_optional_ores_evidence(\n                ores_adapter_path,\n                config.WASMX_DESKTOP_ORES_RECEIPT.as_deref(),\n                &bytes,\n            )\n            .await?;\n            let mut body = json!({\n'''
          new = '''            let ores_evidence = read_optional_ores_evidence(\n                ores_adapter_path,\n                config.WASMX_DESKTOP_ORES_RECEIPT.as_deref(),\n                &bytes,\n            )\n            .await?;\n            let receipt_supplied = ores_evidence.is_some();\n            let mut body = json!({\n'''
          if text.count(old) != 1:
              raise SystemExit('receipt evidence admission block drifted')
          text = text.replace(old, new, 1)
          old = '''                adapter_supplied,\n            )?;\n            println!("{}", serde_json::to_string_pretty(&value)?);\n'''
          new = '''                adapter_supplied,\n            )?;\n            validate_receipt_ack(&value, receipt_supplied)?;\n            println!("{}", serde_json::to_string_pretty(&value)?);\n'''
          if text.count(old) != 1:
              raise SystemExit('deploy acknowledgement call drifted')
          text = text.replace(old, new, 1)
          marker = '''fn validate_status_contract(value: &Value) -> Result<()> {\n'''
          helper = '''fn validate_receipt_ack(value: &Value, receipt_supplied: bool) -> Result<()> {\n    if value.get("ores_receipt_verified").and_then(Value::as_bool) != Some(receipt_supplied) {\n        bail!(\n            "daemon deploy response receipt verification did not match whether ORES receipt evidence was supplied"\n        );\n    }\n    return Ok(());\n}\n\n'''
          if text.count(marker) != 1 or 'fn validate_receipt_ack(' in text:
              raise SystemExit('receipt acknowledgement helper insertion point drifted')
          text = text.replace(marker, helper + marker, 1)
          test_marker = '''    #[test]\n    fn daemon_url_rejects_remote_plaintext() -> Result<()> {\n'''
          test = '''    #[test]\n    fn receipt_ack_requires_exact_verification_status() -> Result<()> {\n        validate_receipt_ack(&json!({"ores_receipt_verified": true}), true)?;\n        validate_receipt_ack(&json!({"ores_receipt_verified": false}), false)?;\n        assert!(validate_receipt_ack(&json!({"ores_receipt_verified": false}), true).is_err());\n        assert!(validate_receipt_ack(&json!({}), false).is_err());\n        return Ok(());\n    }\n\n'''
          if text.count(test_marker) != 1:
              raise SystemExit('receipt acknowledgement test insertion point drifted')
          text = text.replace(test_marker, test + test_marker, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git add src/main.rs
          git rm .github/workflows/harden-receipt-ack.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'hardening: require receipt verification acknowledgement'
          git push origin HEAD:feature/ores-receipt-handoff-v2-20260928
