[package]
name = "wasmx-desktop-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Rust desktop control client for wasm-xprs"
license = "MIT"
autobins = false

[[bin]]
name = "wasmx-desktop-cli"
path = "src/entry.rs"

[dependencies]
anyhow = "1"
base64 = { version = "0.23", default-features = false, features = ["std"] }
flags2env = { git = "https://github.com/flags-2-env/flags-2-env.git", rev = "8c8465561075a8d7ebb58074b3a8087138e97d8f" }
ores-clis-core = { git = "https://github.com/ORESoftware/ores-clis-core.git", rev = "a1dbba19330bd293a5df933baffd2028648dd59b" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
needless_return = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
